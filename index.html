<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>菓菓寵物預約系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        beigeBase: '#F5F2EB', avocado: '#8A9A5B', accentYellow: '#FFEE99',
                        optionBg: '#FFFFF0', calActive: '#dcb88e', textMain: '#4A4A4A',
                        textBrown: '#5C4D43', sibylLight: '#bca085'
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --bg-butter: #FFFDF7;
            --card-bg: #FFFFFF;
            --primary-green: #8A9A5B;
            --text-main: #4A4A4A;
            --text-light: #888888;
            --border-color: #E8DFD5;
            --alert-color: #E07A5F;
        }
        body { 
            background-color: #F5F2EB; 
            font-family: 'Helvetica Neue', Arial, '微軟正黑體', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            padding: 0; 
        }
        .app-card { background: white; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); position: relative; overflow: hidden; }
        .option-card { background-color: #FFFFFF; border: 1.5px solid #E8DFD5; transition: all 0.2s ease-in-out; }
        .hidden-radio:checked + .option-card { border-color: #FFEE99; background-color: #FFFFF0; }
        .text-input { width: 100%; padding: 12px; background: white; border: 1px solid #E8DFD5; border-radius: 12px; font-size: 14px; outline: none; transition: all 0.2s; display: block; box-sizing: border-box; }
        .text-input:focus { border-color: #8A9A5B; }
    </style>
</head>
<body class="w-full overflow-x-hidden" onload="initPage()">

    <div class="w-full bg-white flex flex-col items-center pt-8 pb-5 shadow-sm">
        <img src="https://i.postimg.cc/yYxpMqcX/line-oa-chat-260514-231041.jpg" alt="Logo" class="w-32 h-auto object-contain mb-3">
        <h2 class="text-[22px] font-extrabold text-textBrown tracking-wide"> 菓菓寵物 Pet Grooming </h2>
    </div>

    <div class="w-full bg-avocado text-white py-3 px-4 shadow-md text-[13px] leading-relaxed text-center mb-6">
        <div class="font-bold mb-1 flex items-center justify-center gap-2 text-[14px]">
            <i class="fas fa-bullhorn"></i> 店家最新公告
        </div>
        <div id="announcement"> 公告載入中... </div>
    </div>

    <div class="max-w-md mx-auto px-4 pb-8 space-y-5">

        <div class="app-card p-5 bg-[#FCFAF5]">
            <h3 class="text-center font-extrabold text-[17px] text-textBrown mb-4 tracking-widest flex items-center justify-center gap-1"> ✨ 毛孩變美日記 ✨ </h3>
            <div class="flex justify-center flex-wrap gap-2 pb-2 mb-4">
                <button onclick="filterPhotos('全部', this)" class="portfolio-btn whitespace-nowrap px-4 py-1.5 rounded-full bg-textBrown text-white text-[12px] font-bold shadow-sm"> 全部 </button>
                <button onclick="filterPhotos('皮毛護理', this)" class="portfolio-btn whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-200 text-textBrown text-[12px] font-bold bg-white"> 皮毛護理 </button>
                <button onclick="filterPhotos('口腔護理', this)" class="portfolio-btn whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-200 text-textBrown text-[12px] font-bold bg-white"> 口腔護理 </button>
                <button onclick="filterPhotos('造型美容', this)" class="portfolio-btn whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-200 text-textBrown text-[12px] font-bold bg-white"> 造型美容 </button>
            </div>
            <div class="grid grid-cols-2 gap-3" id="portfolioGrid">
                <div class="col-span-2 text-center text-xs text-gray-400 py-6"> 相簿載入中... </div>
            </div>
        </div>

        <div class="app-card p-5">
            <div class="absolute top-0 left-0 w-2 h-full bg-accentYellow"></div>
            <h3 class="font-bold text-textBrown mb-4 flex items-center gap-2">
                <i class="fas fa-user-alt text-accentYellow drop-shadow-sm"></i> 家長聯絡資訊
            </h3>
            <div class="space-y-4">
                <div class="relative w-full">
                    <input type="tel" id="phone" placeholder="家長聯絡電話 (必填)" class="w-full pl-4 pr-[140px] py-3 bg-white border border-gray-200 rounded-xl focus:border-accentYellow outline-none transition text-sm">
                    <button type="button" onclick="triggerHistorySearch()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-accentYellow text-textBrown px-3 py-1.5 rounded-lg text-[11px] font-bold shadow-sm active:scale-95 transition">
                        查詢/自動帶入
                    </button>
                </div>
                <input type="email" id="email" placeholder="家長電子信箱 (必填)" class="text-input">
                <input type="text" id="lineName" placeholder="家長 LINE 名稱" class="text-input">
                <input type="text" id="ownerName" placeholder="家長姓名" class="text-input">
            </div>
        </div>

        <div class="bg-white border border-[#eae5df] rounded-[2rem] p-6 shadow-sm space-y-4">
            <div class="text-[11px] font-bold text-[#bca085] mb-2 tracking-widest uppercase">
                <i class="fa-solid fa-paw mr-1 text-gray-400"></i> Pet Profile
            </div>
            <div id="dynamicPetContainer" class="space-y-6"></div>
            <button type="button" id="addNewPetBtnEngine" disabled onclick="appendNewPetFormCard()" class="w-full bg-gray-50 border-2 border-dashed border-gray-200 text-gray-400 py-4 rounded-2xl text-xs font-bold shadow-sm flex items-center justify-center gap-1 cursor-not-allowed">
                <i class="fa-solid fa-plus text-[10px]"></i> 雲端價目表同步中...
            </button>
        </div>

        <div class="app-card p-5" id="dateTimeCard">
            <div class="absolute top-0 left-0 w-2 h-full bg-accentYellow"></div>
            <h3 class="font-bold text-textBrown mb-4 flex items-center gap-2"><i class="fas fa-calendar-alt text-accentYellow drop-shadow-sm"></i> 選擇預約日期</h3>
            <div class="bg-white rounded-xl p-3 border border-gray-200 shadow-sm mb-5">
                <div class="flex justify-between items-center mb-4 px-2 mt-1">
                    <i class="fas fa-chevron-left text-textBrown cursor-pointer font-bold p-2" onclick="changeFrontMonth(-1)"></i>
                    <span class="font-extrabold text-textBrown text-[16px]" id="cal_year_month">載入中...</span>
                    <i class="fas fa-chevron-right text-textBrown cursor-pointer font-bold p-2" onclick="changeFrontMonth(1)"></i>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[13px] text-gray-400 font-bold mb-3 border-b border-gray-100 pb-2">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div class="grid grid-cols-7 gap-y-2 gap-x-1 text-center text-[14px] text-textBrown font-bold" id="frontCalGrid"></div>
            </div>
            <h3 class="font-bold text-textBrown mb-3 text-[14px]">預約時段 (9:00 - 17:00)</h3>
            <div class="bg-white rounded-xl p-4 border border-gray-200 shadow-sm" id="timeSlotContainer">
                <div class="text-sm text-gray-400 text-center py-4">請先點選上方日期</div>
            </div>
        </div>

        <div class="flex justify-center gap-5 mb-4">
            <a href="https://lin.ee/6A3s756D" target="_blank" class="w-[52px] h-[52px] bg-white rounded-full flex items-center justify-center border border-[#E8DFD5] shadow-sm active:scale-95 transition text-avocado text-[22px]"><i class="fab fa-line"></i></a>
            <a href="https://www.instagram.com/ninigogo2020" target="_blank" class="w-[52px] h-[52px] bg-white rounded-full flex items-center justify-center border border-[#E8DFD5] shadow-sm active:scale-95 transition text-avocado text-[22px]"><i class="fab fa-instagram"></i></a>
        </div>

        <div class="text-center mb-8 text-[13px] text-gray-500 font-bold tracking-widest">
            <i class="far fa-clock mr-1"></i> 營業時間 9:00-18:30
        </div>

        <button id="submitBtn" onclick="processBooking()" disabled class="w-full bg-gray-200 text-gray-400 font-bold py-4 rounded-xl transition duration-300 cursor-not-allowed mb-6 text-sm">
            請完成必填選項
        </button>

        <div class="text-center mt-2 mb-4 text-sibylLight text-[11px] tracking-widest uppercase">
            Designed by <a href="https://www.heysibyl.com/" target="_blank" class="font-bold hover:underline">Sibyl | 數位管家</a>
        </div>
    </div>

    <!-- 隱藏表單用於 CORS 繞過 -->
    <iframe id="hiddenFrame" name="hiddenFrame" style="display:none;"></iframe>
    <form id="hiddenForm" method="POST" target="hiddenFrame" style="display:none;">
        <input type="hidden" name="action" value="submitBooking">
        <input type="hidden" name="data" id="formDataInput">
    </form>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxiZiL9aFKRo04rzQbgjeexhVvzOAJ0K8cVRfq31dhfNqB2hKLN8O6ARfmA5z3LZY_a/exec";

        let allPhotos = []; 
        let allServices = []; 
        let selectedDateStr = ''; 
        let selectedTimeStr = ''; 
        let currentTotal = 0;
        let currentCalDate = new Date(), calYear = currentCalDate.getFullYear(), calMonth = currentCalDate.getMonth();
        let petCount = 0;
        let globalPackedPetPhotos = {};

        function callGasGet(action, params = {}) {
            let url = `${API_URL}?action=${action}`;
            for (let key in params) {
                url += `&${key}=${encodeURIComponent(params[key])}`;
            }
            return fetch(url).then(res => res.json());
        }

        function initPage() {
            renderFrontCalendar();
            loadAnnouncement();
            loadPortfolio();
            loadServices();
        }

        function loadAnnouncement() {
            callGasGet('getAnnouncementData').then(text => { 
                if(text) document.getElementById('announcement').innerHTML = text; 
            }).catch(err => console.error("公告載入失敗", err));
        }

        function loadPortfolio() {
            callGasGet('getPortfolioData').then(data => { 
                if(data) { allPhotos = data; renderGrid('全部'); } 
            }).catch(err => console.error("相簿載入失敗", err));
        }

        function loadServices() {
            callGasGet('getServiceSettings').then(data => {
                allServices = Array.isArray(data) ? data : []; 
                unlockPetEngineButton(); 
                if(petCount === 0) appendNewPetFormCard();
            }).catch(err => {
                console.error("服務載入失敗", err);
                unlockPetEngineButton(); 
                if(petCount === 0) appendNewPetFormCard();
            });
        }

        function renderGrid(filterCategory) {
            const grid = document.getElementById('portfolioGrid'); 
            if(!grid) return; 
            grid.innerHTML = '';
            const filtered = allPhotos.filter(item => filterCategory === '全部' || item.category === filterCategory);
            if (filtered.length === 0) { 
                grid.innerHTML = '<div class="col-span-2 text-center text-xs text-gray-400 py-6">此分類尚無照片</div>'; 
                return; 
            }
            filtered.forEach(item => { 
                grid.innerHTML += `<div class="bg-white rounded-xl overflow-hidden border border-gray-100 shadow-sm flex flex-col"><div class="w-full h-32 bg-gray-100 bg-cover bg-center" style="background-image: url('${item.imgUrl}')"></div><div class="p-2 h-12 flex items-center justify-center text-center text-[12px] font-bold text-textBrown bg-white leading-snug">${item.title}</div></div>`; 
            });
        }

        function filterPhotos(category, btn) {
            document.querySelectorAll('.portfolio-btn').forEach(b => { 
                b.className = "portfolio-btn whitespace-nowrap px-4 py-1.5 rounded-full border border-gray-200 text-textBrown text-[12px] font-bold bg-white"; 
            });
            btn.className = "portfolio-btn whitespace-nowrap px-4 py-1.5 rounded-full bg-textBrown text-white text-[12px] font-bold shadow-sm";
            renderGrid(category);
        }

        function renderFrontCalendar() {
            const monthTitle = document.getElementById('cal_year_month'); 
            if(!monthTitle) return;
            monthTitle.innerText = `${calYear} 年 ${calMonth + 1} 月`;
            const grid = document.getElementById('frontCalGrid'); 
            if(!grid) return; 
            grid.innerHTML = '';
            const firstDay = new Date(calYear, calMonth, 1).getDay(); 
            const numDays = new Date(calYear, calMonth + 1, 0).getDate();
            let today = new Date(); 
            today.setHours(0,0,0,0); 
            let html = '';
            for(let i=0; i<firstDay; i++) html += `<div class="py-2"></div>`;
            for(let day=1; day<=numDays; day++) {
                let cellDate = new Date(calYear, calMonth, day); 
                let dateString = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                if(cellDate < today) html += `<div class="py-2 text-gray-300 font-normal cursor-not-allowed text-center">${day}</div>`;
                else {
                    if(dateString === selectedDateStr) html += `<div class="py-2 bg-yellow-600 text-white rounded-lg shadow-sm cursor-pointer transform scale-105 transition text-center" onclick="selectDate('${dateString}')">${day}</div>`;
                    else html += `<div class="py-2 cursor-pointer hover:bg-gray-50 rounded-lg transition text-textBrown text-center" onclick="selectDate('${dateString}')">${day}</div>`;
                }
            }
            grid.innerHTML = html;
        }

        function changeFrontMonth(dir) { 
            calMonth += dir; 
            if(calMonth > 11) { calMonth = 0; calYear++; } 
            if(calMonth < 0) { calMonth = 11; calYear--; } 
            renderFrontCalendar(); 
        }

        function selectDate(dateStr) { 
            selectedDateStr = dateStr; 
            selectedTimeStr = ''; 
            renderFrontCalendar(); 
            const container = document.getElementById('timeSlotContainer');
            if(container) container.innerHTML = '<div class="text-sm text-gray-400 text-center py-4">讀取中...</div>'; 
            
            callGasGet('getDailySlots', { dateStr: dateStr })
                .then(renderTimeSlots)
                .catch(err => {
                    console.error("時段讀取失敗", err);
                    if(container) container.innerHTML = '<div class="text-gray-400 text-center py-4">時段讀取失敗</div>';
                });
        }

        function renderTimeSlots(res) { 
            const container = document.getElementById('timeSlotContainer'); 
            if(!container) return; 
            if(res && res.isClosed) { 
                container.innerHTML = `<div class="text-red-500 font-bold text-center">${res.message}</div>`; 
                return; 
            } 
            let html = '<div class="grid grid-cols-3 gap-3">'; 
            if(res && res.availableSlots) { 
                res.availableSlots.forEach(time => { 
                    html += `<button onclick="selectTime('${time}', this)" class="time-btn py-2.5 border border-gray-200 rounded-xl text-textBrown font-bold text-[14px] shadow-sm bg-white hover:bg-gray-50">${time}</button>`; 
                });
            } 
            container.innerHTML = html + '</div>'; 
        }

        function selectTime(time, btn) { 
            selectedTimeStr = time; 
            document.querySelectorAll('.time-btn').forEach(b => { 
                b.className = "time-btn py-2.5 border border-gray-200 bg-white rounded-xl text-textBrown font-bold text-[14px] shadow-sm";
            });
            btn.className = "time-btn py-2.5 border-2 border-accentYellow bg-accentYellow/20 rounded-xl text-textBrown font-bold text-[14px] shadow-sm";
        }

        function triggerHistorySearch() {
            const phone = document.getElementById('phone').value.trim(); 
            if(phone.length < 8) return;
            
            callGasGet('checkCustomerHistory', { phone: phone })
                .then(res => {
                    if(res && res.found) {
                        document.getElementById('ownerName').value = res.ownerName || '';
                        document.getElementById('lineName').value = res.lineName || '';
                        if(res.email) document.getElementById('email').value = res.email || '';
                        Swal.fire({toast:true, position:'top', icon:'success', title: '已自動帶入資料', timer:1500, showConfirmButton:false});
                    } else {
                        Swal.fire({toast:true, position:'top', icon:'info', title: '新客戶', timer:1500, showConfirmButton:false});
                    }
                })
                .catch(err => {
                    console.error("查詢失敗", err);
                    Swal.fire('❌ 查詢失敗', err.message, 'error');
                });
        }

        function appendNewPetFormCard() {
            petCount++;
            const id = petCount;
            const wrapper = document.getElementById('dynamicPetContainer'); 
            if(!wrapper) return;

            const card = document.createElement('div');
            card.className = "bg-white border border-[#E8DFD5] rounded-2xl p-5 space-y-4";
            card.id = `petCardRoot_${id}`;

            let serviceOptions = `<option value="" disabled selected>請選擇服務項目</option>`;
            let categorySet = new Set();
            allServices.forEach(s => { 
                if(s.category && !s.category.includes('加購')) categorySet.add(s.category); 
            });
            Array.from(categorySet).forEach(cat => {
                serviceOptions += `<optgroup label="【 ${cat} 】">`;
                allServices.filter(s => s.category === cat).forEach(item => {
                    serviceOptions += `<option value="${item.service}" data-price="${item.price}">${item.service} ($${item.price})</option>`;
                });
                serviceOptions += `</optgroup>`;
            });

            let addonHtml = "";
            allServices.filter(s => s.category && s.category.includes('加購')).forEach(add => {
                addonHtml += `
                <label class="flex items-center gap-2 p-2 border border-gray-100 rounded-lg cursor-pointer bg-gray-50/50">
                    <input type="checkbox" class="addon-checkbox" data-price="${add.price}" style="accent-color:#8A9A5B;">
                    <span class="text-xs text-textBrown font-medium">${add.service} (+$${add.price})</span>
                </label>`;
            });

            if(addonHtml === "") addonHtml = `<div class="col-span-2 text-[11px] text-gray-400 italic">暫無加購項目</div>`;

            card.innerHTML = `
            <div class="flex justify-between items-center border-b pb-2">
                <span class="bg-[#8A9A5B] text-white font-bold text-[10px] px-3 py-1 rounded-lg">毛孩 NO. ${id}</span>
                ${id > 1 ? `<button type="button" onclick="document.getElementById('petCardRoot_${id}').remove(); recalculatePrice();" class="text-[10px] font-bold text-rose-500">移除</button>` : ''}
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div><input type="text" class="text-input p-name text-[12px]" placeholder="毛孩姓名 *"></div>
                <div><input type="text" class="text-input p-breed text-[12px]" placeholder="品種 *"></div>
            </div>
            <div>
                <label class="text-[11px] font-bold text-textBrown mb-1 block">主服務項目 *</label>
                <select class="text-input p-main-service text-gray-600 font-bold" onchange="recalculatePrice()" required>${serviceOptions}</select>
            </div>
            <div>
                <label class="text-[11px] font-bold text-textBrown mb-1.5 block">專屬加購護理 (可複選)</label>
                <div class="grid grid-cols-2 gap-2">${addonHtml}</div>
            </div>
            `;
            wrapper.appendChild(card);
            
            // 監聽加購勾選
            card.querySelectorAll('.addon-checkbox').forEach(cb => {
                cb.addEventListener('change', recalculatePrice);
            });
        }

        function recalculatePrice() {
            let total = 0; 
            const container = document.getElementById('dynamicPetContainer'); 
            if (!container) return;
            
            for (let i = 0; i < container.children.length; i++) {
                const cardEl = container.children[i]; 
                const mainSelect = cardEl.querySelector('.p-main-service');
                
                if (mainSelect && mainSelect.value !== "") {
                    const selectedOption = mainSelect.options[mainSelect.selectedIndex];
                    if (selectedOption) total += parseFloat(selectedOption.getAttribute('data-price')) || 0;
                }
                
                cardEl.querySelectorAll('.addon-checkbox:checked').forEach(cb => {
                    total += parseFloat(cb.getAttribute('data-price')) || 0;
                });
            }
            
            currentTotal = total;
            updateSubmitBtn();
        }

        function updateSubmitBtn() {
            const btn = document.getElementById('submitBtn'); 
            if(!btn) return;
            
            const hasPhone = document.getElementById('phone').value.trim().length > 0;
            const hasEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(document.getElementById('email').value.trim());
            const hasDate = selectedDateStr !== '';
            const hasTime = selectedTimeStr !== '';
            const container = document.getElementById('dynamicPetContainer');
            let hasPets = false;
            
            if(container && container.children.length > 0) {
                hasPets = true;
                for (let i = 0; i < container.children.length; i++) {
                    const cardEl = container.children[i]; 
                    const pName = cardEl.querySelector('.p-name').value.trim();
                    const mainService = cardEl.querySelector('.p-main-service').value;
                    if(!pName || !mainService) { 
                        hasPets = false; 
                        break; 
                    }
                }
            }
            
            if (hasPhone && hasEmail && hasPets && hasDate && hasTime) {
                btn.disabled = false; 
                btn.className = "w-full bg-avocado text-white font-bold py-4 rounded-xl shadow-md text-sm cursor-pointer transform active:scale-95 transition-all duration-200 mb-6";
                btn.innerText = `送出預約申請 (預估 $${currentTotal})`;
            } else {
                btn.disabled = true; 
                btn.className = "w-full bg-[#F5F5F5] text-gray-400 font-bold py-4 rounded-xl cursor-not-allowed text-sm mb-6"; 
                btn.innerText = '請完成必填選項（電話、Email、毛孩、日期、時段）';
            }
        }

        // 🌟 提交 - 使用隱藏表單（繞過 CORS）
        function processBooking() {
            const btn = document.getElementById('submitBtn'); 
            if(!btn) return;
            
            btn.innerText = '送出中...'; 
            btn.disabled = true;
            
            const container = document.getElementById('dynamicPetContainer'); 
            const petsArray = [];
            
            if(container && container.children.length > 0) {
                for (let i = 0; i < container.children.length; i++) {
                    const cardEl = container.children[i]; 
                    const pName = cardEl.querySelector('.p-name').value.trim();
                    const mainService = cardEl.querySelector('.p-main-service').value;
                    
                    if(!pName || !mainService) {
                        Swal.fire('❌ 錯誤', '請填完所有必填欄位', 'error');
                        btn.innerText = '送出預約申請'; 
                        btn.disabled = false;
                        return;
                    }
                    
                    let addons = [];
                    cardEl.querySelectorAll('.addon-checkbox:checked').forEach(cb => {
                        addons.push(cb.parentElement.textContent.trim());
                    });
                    
                    petsArray.push({
                        name: pName,
                        breed: cardEl.querySelector('.p-breed').value.trim(),
                        mainService: mainService,
                        addons: addons.join(', ')
                    });
                }
            }

            const formData = {
                date: selectedDateStr, 
                time: selectedTimeStr, 
                phone: document.getElementById('phone').value.trim(), 
                lineName: document.getElementById('lineName').value,
                ownerName: document.getElementById('ownerName').value, 
                email: document.getElementById('email').value.trim(),
                petsJsonString: JSON.stringify(petsArray),
                price: currentTotal,
                remark: '前台預約單',
                petPhotoBase64: '',
                signatureDataBase64: ''
            };

            // 使用隱藏表單提交
            document.getElementById('formDataInput').value = JSON.stringify({
                action: 'submitBooking',
                data: formData
            });

            const frame = document.getElementById('hiddenFrame');
            let loaded = false;
            
            const checkFrame = () => {
                if(!loaded) {
                    loaded = true;
                    Swal.fire({
                        title: '✅ 預約已送出！',
                        text: '資料正在處理中...',
                        icon: 'success',
                        confirmButtonColor: '#8A9A5B'
                    }).then(() => { 
                        setTimeout(() => { window.location.reload(); }, 2000);
                    });
                }
            };

            frame.onload = checkFrame;
            setTimeout(checkFrame, 3000);

            // 提交隱藏表單
            document.getElementById('hiddenForm').submit();
        }
    </script>
</body>
</html>
